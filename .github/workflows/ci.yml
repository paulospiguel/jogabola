name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: TypeScript
        run: pnpm ts-check
      - name: Validate migration metadata
        run: pnpm exec drizzle-kit check --config ./src/db/drizzle.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/jogabola_ci
      - name: Run unit tests
        run: pnpm test
      - name: Build Next.js
        run: pnpm build
        env:
          # Non-sensitive placeholders used only to validate the production build.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/jogabola_ci
          BETTER_AUTH_SECRET: ci-only-build-secret-not-for-runtime-use-0123456789abcdef
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_only_build_key
