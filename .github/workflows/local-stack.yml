name: Local stack
on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'Dockerfile*'
      - '.dockerignore'
      - '.github/workflows/local-stack.yml'
      - 'scripts/**'
      - 'src/db/**'
      - 'src/app/api/auth/**'
      - 'src/lib/auth*'
      - 'src/lib/auth/**'
      - 'src/lib/email*'
      - 'src/actions/auth-otp.actions.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-stack-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Start development stack
        run: docker compose up --build -d
      - name: Wait for the auth API
        run: curl --fail --silent --retry 40 --retry-delay 3 --retry-all-errors --max-time 60 http://localhost:3000/api/auth/get-session
      - name: Sign in with a local email
        run: node scripts/smoke-local.mjs
      - name: Verify fresh and legacy database migrations
        run: >-
          docker compose exec -T
          -e JOGABOLA_TEST_DATABASE_URL=postgresql://jogabola:jogabola-local-only@postgres:5432/postgres
          app node scripts/test-db-migrations.mjs
      - name: Confirm data survives container recreation
        run: |
          docker compose down
          docker compose up -d --wait postgres
          count=$(docker compose exec -T postgres psql -U jogabola -d jogabola -Atc 'SELECT count(*) FROM "user"')
          test "$count" -eq 1
      - name: Inspect service status on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100 app postgres
      - name: Remove the ephemeral CI stack
        if: always()
        run: docker compose down --volumes
